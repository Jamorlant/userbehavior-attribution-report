[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["data", "outputs", "figures", "build", "build-ci", "build-outputs", "build-figures", "_tmp_syn"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # 报告里的中文长句由 line-length 约束，表头/标题不强制折行

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
