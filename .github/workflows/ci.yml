name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # CI 不下载 1 GB 真实数据，用仓库内 100 万行合成回退数据做冒烟
  UBA_LOG_LEVEL: INFO
  UBA_DUCKDB_MEMORY: 2GB
  UBA_DUCKDB_THREADS: 2
  UBA_CACHE_DIR: build-ci

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Format check
        run: python -m ruff format --check .
      - name: Unit tests
        run: python -m pytest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install CJK font (图表中文)
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run analysis pipeline
        run: python -m uba.pipeline --out build-outputs
      - name: Assert metrics were produced
        run: python -c "import json,pathlib; m=json.loads(pathlib.Path('build-outputs/metrics.json').read_text(encoding='utf-8')); assert m['audit']['clean_rows']>0 and m['funnel']['pv']>0"
      - name: Render figures
        run: python -m uba.figures --out build-outputs --figdir build-figures
      - name: Build HTML report
        run: python -m uba.report
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: report-artifacts
          path: |
            build-outputs/
            build-figures/
            report/attribution-report.html
